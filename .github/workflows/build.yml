name: Build & Push IconVault Docker Image to GHCR

on:
  push:
    # Trigger de workflow alleen bij pushes naar de 'main' branch
    branches: [ main ]
  # Sta handmatige triggers toe vanuit de GitHub UI
  workflow_dispatch:

jobs:
  build_and_push:
    # Voer de job uit op een Ubuntu runner
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Code Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: 🔑 Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          # Gebruik de GHCR registry URL
          registry: ghcr.io
          # Gebruik de GitHub actions gebruiker
          username: ${{ github.actor }}
          # Gebruik de ingebouwde GITHUB_TOKEN voor authenticatie
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Define Image Tags for GHCR
        id: meta
        # Definieer de repository naam en tag format.
        # ${{ github.repository_owner }} is de GitHub gebruikersnaam/organisatie.
        # ${{ github.event.repository.name }} is de naam van de repo.
        run: |
          REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          TAG_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          # GHCR format is ghcr.io/<eigenaar>/<repo-naam>
          echo "image_name=ghcr.io/$REPO_NAME" >> $GITHUB_OUTPUT
          echo "tag_sha=$TAG_SHA" >> $GITHUB_OUTPUT
        
      - name: 🔨 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tags nu ingesteld op GHCR format
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: 📝 Output Tag Information
        run: echo "Image ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag_sha }} succesvol gepusht naar GHCR."
