<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Icoon maken · Iconator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <div class="brand-mark" aria-hidden="true">◆</div>
        <div>
          <h1>Iconator</h1>
          <p>Icoon maken</p>
        </div>
      </a>
      <a class="ghost-link" href="/library.html">Naar bibliotheek</a>
    </header>

    <div class="creator-layout">
      <section class="panel editor-stage-wrap">
        <div id="editorStage" class="editor-stage">
          <canvas id="editorCanvas" aria-label="Icoon editor"></canvas>
          <div id="maskRing" class="mask-ring round" aria-hidden="true"></div>
        </div>
        <p class="muted">Sleep om te verschuiven · Scroll om te zoomen</p>
      </section>

      <section class="panel controls-panel">
        <h2>Instellingen</h2>

        <div class="field">
          <label for="imageInput">Afbeelding</label>
          <input id="imageInput" type="file" accept="image/*">
        </div>

        <div class="field">
          <label for="iconName">Naam (optioneel)</label>
          <input id="iconName" type="text" maxlength="120" placeholder="Bijv. Home-knop">
        </div>

        <div class="field">
          <label>Masker</label>
          <div class="control-row">
            <button type="button" class="btn btn-ghost active" data-mask="round" aria-pressed="true">Rond</button>
            <button type="button" class="btn btn-ghost" data-mask="square" aria-pressed="false">Vierkant</button>
          </div>
        </div>

        <div class="field">
          <label>Weergave</label>
          <div class="control-row">
            <button type="button" class="btn btn-ghost active" data-mode="transparent" aria-pressed="true">Transparant</button>
            <button type="button" class="btn btn-ghost" data-mode="normal" aria-pressed="false">Normaal</button>
          </div>
        </div>

        <div class="field">
          <label for="threshold">Zwarte achtergrond filter (<span id="thresholdValue">35%</span>)</label>
          <input id="threshold" type="range" min="0" max="100" value="35">
          <p class="muted">Alleen actief bij transparant. Hoger = meer zwart wordt transparant.</p>
        </div>

        <div class="control-row">
          <img id="exportPreview" class="preview-thumb" alt="Voorbeeld export">
          <div class="spacer"></div>
          <button id="zipBtn" type="button" class="btn btn-secondary" disabled>Exporteer ZIP</button>
          <button id="saveBtn" type="button" class="btn btn-primary" disabled>Opslaan in bibliotheek</button>
        </div>
        <p class="muted">ZIP bevat PNG’s in 32, 128, 192, 256 en 512 px.</p>

        <p id="status" class="status" role="status"></p>
      </section>
    </div>
  </div>

  <script src="/js/vendor/jszip.min.js"></script>
  <script type="module" src="/js/create.js"></script>
</body>
</html>
