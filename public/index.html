<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconVault Pro - Collectie Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel voor JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- NIEUW: JSZip & FileSaver voor Client-side generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f172a',       // Slate 900
                        dark_paper: '#1e293b', // Slate 800
                        primary: '#6366f1',    // Indigo 500
                        primary_hover: '#4f46e5',
                        accent: '#8b5cf6',     // Violet 500
                        success: '#22c55e', 
                        error: '#ef4444'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .hover-lift {
            transition: all 0.2s ease-in-out;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border-color: #6366f1;
        }

        /* Grid voor map previews */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        /* Toast Animatie */
        .toast-enter { transform: translateX(100%); opacity: 0; }
        .toast-enter-active { transform: translateX(0); opacity: 1; transition: all 300ms ease-out; }
        .toast-exit { transform: translateX(0); opacity: 1; }
        .toast-exit-active { transform: translateX(100%); opacity: 0; transition: all 300ms ease-in; }

        /* Grid vs List Layouts - COMPACTER GEMAAKT (110px min) */
        .layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.75rem; }
        @media (min-width: 640px) { .layout-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }
        
        .layout-list { display: flex; flex-direction: column; gap: 0.5rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useContext, createContext } = React;

    const API_URL = '/api';

    // --- CONTEXT: TOAST NOTIFICATIES ---
    const ToastContext = createContext();
    
    const ToastProvider = ({ children }) => {
        const [toasts, setToasts] = useState([]);
        const addToast = (msg, type = 'success') => {
            const id = Date.now();
            setToasts(prev => [...prev, { id, msg, type }]);
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
        };
        return (
            <ToastContext.Provider value={addToast}>
                {children}
                <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
                    {toasts.map(t => (
                        <div key={t.id} className={`toast-enter-active px-4 py-3 rounded-xl shadow-2xl text-white text-sm font-medium flex items-center gap-3 backdrop-blur-md pointer-events-auto border border-white/10 ${t.type === 'error' ? 'bg-red-500/90' : 'bg-green-600/90'}`}>
                            {t.type === 'error' ? <Icon name="alert-circle" size={18} /> : <Icon name="check-circle" size={18} />}
                            {t.msg}
                        </div>
                    ))}
                </div>
            </ToastContext.Provider>
        );
    };
    const useToast = () => useContext(ToastContext);

    // --- UTILS: Image Processing ---

    const processImage = (file, size = 'original') => {
        return new Promise((resolve) => {
            if (file.type === 'image/svg+xml') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    resolve({ blob: file, fileName: file.name, width: 0, height: 0, isSvg: true });
                };
                reader.readAsText(file);
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let finalBlob = file;
                    let width = img.width;
                    let height = img.height;

                    if (size !== 'original') {
                        const canvas = document.createElement('canvas');
                        canvas.width = parseInt(size);
                        canvas.height = parseInt(size);
                        const ctx = canvas.getContext('2d');
                        
                        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                        const w = img.width * scale;
                        const h = img.height * scale;
                        const x = (canvas.width - w) / 2;
                        const y = (canvas.height - h) / 2;

                        ctx.drawImage(img, x, y, w, h);
                        
                        canvas.toBlob((blob) => {
                             resolve({ blob, fileName: file.name, width: canvas.width, height: canvas.height, isSvg: false });
                        }, 'image/png');
                        return;
                    }

                    resolve({ blob: file, fileName: file.name, width, height, isSvg: false });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    };

    // --- NIEUW: CLIENT SIDE ZIP GENERATOR ---
    const generateAndDownloadZip = async (imageSource, baseName, isUrl = false) => {
        const sizes = [16, 32, 48, 64, 128, 256, 512];
        const zip = new JSZip();
        
        let img;
        if (isUrl) {
            img = new Image();
            img.crossOrigin = "Anonymous";
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = reject;
                img.src = imageSource;
            });
        } else {
            img = await new Promise((resolve) => {
                const i = new Image();
                i.onload = () => resolve(i);
                i.src = URL.createObjectURL(imageSource);
            });
        }

        const promises = sizes.map(size => {
            return new Promise(resolve => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                const scale = Math.min(size / img.width, size / img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                const x = (size - w) / 2;
                const y = (size - h) / 2;

                ctx.drawImage(img, x, y, w, h);
                
                canvas.toBlob(blob => {
                    zip.file(`${baseName}-${size}x${size}.png`, blob);
                    resolve();
                }, 'image/png');
            });
        });

        await Promise.all(promises);
        const content = await zip.generateAsync({ type: "blob" });
        saveAs(content, `${baseName}-pack.zip`);
    };

    // --- ICONS WRAPPER ---
    const Icon = ({ name, size = 20, className, ...props }) => {
        const ref = useRef(null);
        useEffect(() => {
            if (window.lucide) {
                window.lucide.createIcons({
                    root: ref.current,
                    nameAttr: 'data-lucide',
                    attrs: { width: size, height: size, class: className }
                });
            }
        }, [name, size, className]);
        return <span ref={ref} {...props}><i data-lucide={name}></i></span>;
    };

    // --- COMPONENTS ---

    // 1. Sidebar Component (Met Tools & Tags)
    const Sidebar = ({ folders, activeFolderId, onSelectFolder, onSelectAll, onAddFolder, allIcons, activeTag, onSelectTag, onOpenGenerator }) => {
        const handleCreateFolder = () => {
            const name = prompt("Naam van nieuwe map:");
            if (name) onAddFolder(name);
        };

        const uniqueTags = useMemo(() => {
            const tags = new Set();
            allIcons.forEach(icon => { if (icon.tags) icon.tags.forEach(t => tags.add(t)); });
            return Array.from(tags).sort((a, b) => {
                // Sorteer tags: nummers eerst, dan tekst
                const numA = parseInt(a);
                const numB = parseInt(b);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                return a.localeCompare(b);
            });
        }, [allIcons]);

        return (
            <aside className="hidden md:flex flex-col w-64 h-screen bg-dark_paper border-r border-slate-700 fixed left-0 top-0 overflow-y-auto z-20">
                {/* Logo Area */}
                <div className="p-6 flex items-center gap-3 border-b border-slate-700/50">
                    <div className="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-xl flex items-center justify-center text-white shadow-lg">
                        <Icon name="layers" size={20} />
                    </div>
                    <div>
                        <h1 className="font-bold text-xl text-white tracking-tight">IconVault</h1>
                        <p className="text-xs text-slate-400">Pro Manager</p>
                    </div>
                </div>

                {/* Navigation */}
                <div className="p-4 flex-1">
                    
                    {/* Tools Section */}
                    <div className="mb-6">
                         <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 px-2">Tools</div>
                         <button 
                            onClick={onOpenGenerator}
                            className="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/50 hover:border-primary/50 transition-all group"
                        >
                            <div className="p-1 bg-slate-800 rounded group-hover:bg-primary group-hover:text-white transition-colors">
                                <Icon name="wand-2" size={14} />
                            </div>
                            Generator
                        </button>
                    </div>

                    <div className="flex justify-between items-center mb-2 px-2">
                        <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Bibliotheek</div>
                        <button onClick={handleCreateFolder} className="text-primary hover:text-white transition-colors p-1 hover:bg-slate-700 rounded" title="Nieuwe map">
                            <Icon name="plus" size={14} />
                        </button>
                    </div>
                    <nav className="space-y-1">
                        <button 
                            onClick={onSelectAll}
                            className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                                activeFolderId === null && activeTag === null
                                ? 'bg-primary/10 text-primary border border-primary/20' 
                                : 'text-slate-400 hover:bg-slate-800 hover:text-white border border-transparent'
                            }`}
                        >
                            <Icon name="layout-grid" size={18} />
                            Alle Collecties
                        </button>
                        <div className="pt-2 pb-2"></div>
                        {folders.map(folder => (
                            <button 
                                key={folder.id}
                                onClick={() => onSelectFolder(folder.id)}
                                className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${
                                    activeFolderId === folder.id
                                    ? 'bg-slate-800 text-white border border-slate-700' 
                                    : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 border border-transparent'
                                }`}
                            >
                                <Icon name="folder" size={18} />
                                {folder.name}
                            </button>
                        ))}
                    </nav>

                    {/* Tags */}
                    {uniqueTags.length > 0 && (
                        <div className="mt-8">
                             <div className="flex items-center gap-2 mb-3 px-2 text-xs font-bold text-slate-500 uppercase tracking-wider">
                                <Icon name="tag" size={12} /> Tags & Formaten
                            </div>
                            <div className="flex flex-wrap gap-2 px-2">
                                {uniqueTags.map(tag => (
                                    <button
                                        key={tag}
                                        onClick={() => onSelectTag(tag)}
                                        className={`text-[10px] px-2.5 py-1 rounded-md border transition-all ${
                                            activeTag === tag
                                            ? 'bg-primary text-white border-primary shadow-md'
                                            : 'bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-600 hover:text-slate-200'
                                        }`}
                                    >
                                        {tag}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>

                {/* Footer Info */}
                <div className="p-4 border-t border-slate-700/50">
                    <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center">
                                <span className="text-xs font-bold text-white">IV</span>
                            </div>
                            <div className="flex-1">
                                <div className="text-xs font-medium text-white">Versie 2.2</div>
                                <div className="text-[10px] text-green-400 flex items-center gap-1">
                                    <div className="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></div> Online
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        );
    };

    // 2. Collection Card
    const CollectionCard = ({ collection, icons, onClick, onDropFile }) => {
        const previewIcons = icons.slice(0, 4);
        const [isDragOver, setIsDragOver] = useState(false);

        const handleDragOver = (e) => { e.preventDefault(); setIsDragOver(true); };
        const handleDragLeave = (e) => { e.preventDefault(); setIsDragOver(false); };
        const handleDrop = (e) => {
            e.preventDefault(); e.stopPropagation(); setIsDragOver(false);
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                onDropFile(e.dataTransfer.files, collection);
            }
        };

        return (
            <div 
                onClick={onClick}
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
                className={`
                    relative hover-lift bg-dark_paper border rounded-2xl p-4 flex flex-col cursor-pointer group h-auto transition-all
                    ${isDragOver ? 'border-primary bg-primary/10 shadow-[0_0_30px_rgba(99,102,241,0.3)]' : 'border-slate-700'}
                `}
            >
                {/* Drag Overlay */}
                {isDragOver && (
                    <div className="absolute inset-0 z-10 flex items-center justify-center bg-dark_paper/90 rounded-2xl border-2 border-primary border-dashed">
                        <div className="text-primary font-bold flex flex-col items-center animate-bounce">
                            <Icon name="upload-cloud" size={32} />
                            <span className="mt-2">Hier loslaten</span>
                        </div>
                    </div>
                )}

                <div className="w-full aspect-square mb-3 bg-dark rounded-xl overflow-hidden p-1 relative">
                    {icons.length > 0 ? (
                        <div className="folder-grid w-full h-full">
                            {previewIcons.map(icon => (
                                <div key={icon.id} className="bg-slate-800/50 rounded flex items-center justify-center p-2 overflow-hidden">
                                    <img src={icon.url} className="w-full h-full object-contain opacity-90" loading="lazy" />
                                </div>
                            ))}
                            {[...Array(Math.max(0, 4 - previewIcons.length))].map((_, i) => (
                                <div key={`empty-${i}`} className="bg-slate-800/30 rounded"></div>
                            ))}
                        </div>
                    ) : (
                        <div className="w-full h-full flex items-center justify-center text-slate-600">
                            <Icon name="image" size={32} />
                        </div>
                    )}
                    <div className="absolute inset-0 bg-primary/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                        <span className="bg-primary text-white text-xs px-3 py-1.5 rounded-full font-bold shadow-lg">Openen</span>
                    </div>
                </div>

                <div className="flex items-center justify-between mt-auto">
                    <div>
                        <h3 className="font-bold text-slate-200 text-sm truncate w-24 md:w-32">{collection.name}</h3>
                        <p className="text-[10px] text-slate-500">{icons.length} iconen</p>
                    </div>
                    <Icon name="folder" className="text-slate-600 group-hover:text-primary transition-colors" size={20} />
                </div>
            </div>
        );
    };

    // 3. Icon Card (Aangepast: Geen kleuren, geen smart download)
    const IconCard = ({ icon, onDelete, viewMode, onCopy }) => {
        
        if (viewMode === 'list') {
            return (
                <div className="group flex items-center gap-4 p-3 bg-dark_paper border border-slate-700 rounded-xl hover:border-primary transition-all">
                    <div className="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center flex-shrink-0 relative overflow-hidden">
                        <div className="absolute inset-0 opacity-20 bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAHElEQVQYlWNgYGD4z8DAwMgwyoAOSMQAoQowAABWJgQD63K4OQAAAABJRU5ErkJggg==')]"></div>
                        <img src={icon.url} alt={icon.name} loading="lazy" className="w-8 h-8 object-contain relative z-10" />
                    </div>
                    <div className="flex-1 min-w-0">
                        <h4 className="font-bold text-slate-200 text-sm truncate">{icon.name}</h4>
                        <div className="flex items-center gap-2 mt-1">
                            {icon.tags && icon.tags.map(tag => (
                                <span key={tag} className="px-1.5 py-0.5 rounded bg-slate-800 text-[10px] text-slate-400 font-mono">{tag}</span>
                            ))}
                            <span className="text-[10px] text-slate-600">{(icon.size/1024).toFixed(1)} KB</span>
                        </div>
                    </div>
                    
                    {/* List Actions */}
                    <div className="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                         <button onClick={() => onCopy(icon.url)} className="p-2 hover:bg-slate-700 rounded text-slate-400 hover:text-white" title="Kopieer HTML"><Icon name="code" size={16} /></button>
                         {/* Direct Download */}
                         <a href={icon.url} download className="p-2 hover:bg-slate-700 rounded text-slate-400 hover:text-white" title="Download Bestand"><Icon name="download" size={16} /></a>
                         <button onClick={() => onDelete(icon.id)} className="p-2 hover:bg-slate-700 rounded text-red-400 hover:text-red-300" title="Verwijderen"><Icon name="trash-2" size={16} /></button>
                    </div>
                </div>
            )
        }

        // Grid View
        return (
            <div className="group relative aspect-square bg-dark_paper border border-slate-700 rounded-2xl overflow-hidden hover:border-primary transition-colors cursor-pointer">
                <div className="absolute inset-0 opacity-10 bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAHElEQVQYlWNgYGD4z8DAwMgwyoAOSMQAoQowAABWJgQD63K4OQAAAABJRU5ErkJggg==')]"></div>
                
                <div className="absolute inset-0 flex items-center justify-center p-6">
                    <img 
                        src={icon.url} 
                        alt={icon.name} 
                        loading="lazy"
                        className="w-full h-full object-contain drop-shadow-sm transition-transform duration-300 group-hover:scale-105" 
                    />
                </div>

                {/* Hover Overlay */}
                <div className="absolute inset-0 bg-slate-900/90 opacity-0 group-hover:opacity-100 transition-all duration-200 flex flex-col items-center justify-center gap-3 p-4 backdrop-blur-sm">
                    <span className="text-white font-bold text-sm text-center truncate w-full px-2">{icon.name}</span>
                    
                    <div className="flex gap-2 mt-1">
                        <button onClick={() => onCopy(icon.url)} className="p-2 bg-slate-700 hover:bg-slate-600 text-white rounded-full shadow-lg" title="Kopieer Code">
                            <Icon name="code" size={16} />
                        </button>
                        {/* Direct Download */}
                        <a href={icon.url} download className="p-2 bg-primary hover:bg-primary_hover text-white rounded-full shadow-lg" title="Direct Download">
                            <Icon name="download" size={16} />
                        </a>
                        <button onClick={(e) => { e.stopPropagation(); onDelete(icon.id); }} className="p-2 bg-slate-700 text-red-400 hover:bg-red-500 hover:text-white rounded-full shadow-lg" title="Verwijderen">
                            <Icon name="trash-2" size={16} />
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // 4. GENERATOR VIEW (Niet in DB)
    const GeneratorView = () => {
        const [activeFile, setActiveFile] = useState(null);
        const [isProcessing, setIsProcessing] = useState(false);
        const fileInputRef = useRef(null);

        const handleFile = (file) => {
            if (!file) return;
            setActiveFile(file);
        };

        const generate = async () => {
            if(!activeFile) return;
            setIsProcessing(true);
            try {
                // Gebruik de client-side zip functie
                const baseName = activeFile.name.split('.')[0];
                await generateAndDownloadZip(activeFile, baseName, false);
            } catch (e) {
                console.error(e);
                alert("Fout bij genereren");
            } finally {
                setIsProcessing(false);
            }
        };

        return (
            <div className="max-w-3xl mx-auto py-10 animate-in fade-in zoom-in duration-300">
                <div className="mb-8 text-center">
                    <h2 className="text-3xl font-bold text-white mb-2">Offline Generator</h2>
                    <p className="text-slate-400">Sleep een groot bestand hierheen. De browser maakt lokaal een ZIP met alle icoon-formaten (16-512px).</p>
                </div>

                <div 
                    className={`
                        border-2 border-dashed rounded-3xl p-12 text-center transition-all cursor-pointer relative overflow-hidden h-96 flex flex-col items-center justify-center
                        ${activeFile ? 'border-success bg-success/5' : 'border-slate-700 hover:border-primary hover:bg-primary/5 bg-dark_paper'}
                    `}
                    onClick={() => !activeFile && fileInputRef.current.click()}
                    onDragOver={e => e.preventDefault()}
                    onDrop={e => {
                        e.preventDefault();
                        if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
                    }}
                >
                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={e => handleFile(e.target.files[0])} />
                    
                    {activeFile ? (
                        <div className="flex flex-col items-center w-full">
                            <div className="w-32 h-32 bg-slate-900 rounded-2xl mb-6 shadow-2xl p-4 flex items-center justify-center">
                                <img src={URL.createObjectURL(activeFile)} className="max-w-full max-h-full object-contain" />
                            </div>
                            <h3 className="text-xl font-bold text-white mb-1">{activeFile.name}</h3>
                            <p className="text-sm text-slate-500 mb-6">{(activeFile.size/1024).toFixed(1)} KB</p>
                            
                            <div className="flex gap-4">
                                <button onClick={(e) => { e.stopPropagation(); setActiveFile(null); }} className="px-6 py-2 rounded-xl text-slate-400 hover:bg-slate-800 transition-colors">Ander bestand</button>
                                <button 
                                    onClick={(e) => { e.stopPropagation(); generate(); }} 
                                    disabled={isProcessing}
                                    className="px-8 py-2 rounded-xl bg-success hover:bg-green-500 text-white font-bold shadow-lg shadow-green-500/20 flex items-center gap-2"
                                >
                                    {isProcessing ? <Icon name="loader" className="animate-spin" /> : <Icon name="download" />}
                                    Download ZIP
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div>
                            <div className="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-500">
                                <Icon name="wand-2" size={32} />
                            </div>
                            <h3 className="text-lg font-bold text-slate-300 mb-2">Sleep bestand of klik</h3>
                            <p className="text-xs text-slate-500">PNG, JPG of SVG (Minimaal 512x512 aanbevolen)</p>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // 5. Upload Modal (Auto Tags Toegevoegd)
    const UploadModal = ({ isOpen, onClose, onUpload, activeCollection, activeFolder, initialFiles }) => {
        const [mode, setMode] = useState('single');
        const [dragActive, setDragActive] = useState(false);
        const [isLoading, setIsLoading] = useState(false);
        const [filesToUpload, setFilesToUpload] = useState([]);
        const [singleFormData, setSingleFormData] = useState({ name: '', size: 'original' });
        const [singlePreview, setSinglePreview] = useState(null);
        
        const fileInputRef = useRef(null);

        useEffect(() => {
            if(isOpen) {
                setFilesToUpload([]);
                setSinglePreview(null);
                setSingleFormData({ name: '', size: 'original' });
                
                if (initialFiles && initialFiles.length > 0) {
                    setMode('bulk'); 
                    handleFiles(initialFiles);
                } else {
                    setMode('single');
                }
            }
        }, [isOpen, initialFiles]);

        const activeCollectionName = activeCollection?.name || 'Onbekend';

        const handleFiles = async (fileList) => {
            const processed = await Promise.all(Array.from(fileList).map(f => processImage(f)));
            setFilesToUpload(prev => [...prev, ...processed]);
            
            if (mode === 'single' && fileList.length === 1) {
                const f = processed[0];
                setSinglePreview(URL.createObjectURL(f.blob));
                setSingleFormData(prev => ({ ...prev, name: f.fileName.split('.')[0].replace(/[-_]/g, ' ') }));
            }
        };

        const handleUploadAction = async () => {
            if (!activeCollection || !activeFolder) return;
            setIsLoading(true);

            try {
                let finalFiles = [];
                
                if (mode === 'single' && singlePreview) {
                    const rawFile = filesToUpload[0].blob; 
                    const processed = await processImage(rawFile, singleFormData.size);
                    const autoTag = processed.isSvg ? 'SVG' : Math.max(processed.width, processed.height).toString();
                    
                    // NIEUW: Extraheer extensie
                    const extension = processed.fileName.split('.').pop().toUpperCase();
                    const tags = [autoTag];
                    if (extension && extension !== 'SVG') tags.push(extension); // Voorkom dubbele 'SVG'
                    
                    finalFiles.push({
                        ...processed,
                        finalName: singleFormData.name,
                        tags: tags
                    });
                } else {
                    finalFiles = filesToUpload.map(f => {
                         const autoTag = f.isSvg ? 'SVG' : Math.max(f.width, f.height).toString();
                         const extension = f.fileName.split('.').pop().toUpperCase();
                         const tags = [autoTag];
                         if (extension && extension !== 'SVG') tags.push(extension);

                         return {
                            ...f,
                            finalName: f.fileName.split('.')[0].replace(/[-_]/g, ' '),
                            tags: tags
                         };
                    });
                }

                await onUpload(finalFiles, activeCollection, activeFolder);
                onClose();

            } catch (error) {
                console.error(error);
                alert('Fout: ' + error.message);
            } finally {
                setIsLoading(false);
            }
        };
        
        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-in fade-in duration-200">
                <div className="bg-dark_paper w-full max-w-2xl rounded-2xl border border-slate-600 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                    
                    <div className="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                        <div>
                            <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                <Icon name="upload-cloud" className="text-primary" size={24} />
                                Uploaden naar <span className="text-primary">{activeCollectionName}</span>
                            </h3>
                        </div>
                        <button onClick={onClose} className="text-slate-400 hover:text-white"><Icon name="x" size={24} /></button>
                    </div>

                    <div className="flex border-b border-slate-700">
                        <button onClick={() => setMode('single')} className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${mode === 'single' ? 'border-primary text-white bg-primary/5' : 'border-transparent text-slate-400 hover:text-white'}`}>Enkel Bestand</button>
                        <button onClick={() => setMode('bulk')} className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${mode === 'bulk' ? 'border-primary text-white bg-primary/5' : 'border-transparent text-slate-400 hover:text-white'}`}>Bulk Import</button>
                    </div>

                    <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
                        
                        {((mode === 'single' && !singlePreview) || mode === 'bulk') && (
                            <div 
                                className={`relative border-2 border-dashed rounded-xl flex flex-col items-center justify-center p-8 transition-colors cursor-pointer mb-4
                                    ${dragActive ? 'border-primary bg-primary/10' : 'border-slate-600 hover:border-slate-500 bg-dark'}`}
                                onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }}
                                onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }}
                                onDragOver={(e) => { e.preventDefault(); }}
                                onDrop={(e) => { e.preventDefault(); setDragActive(false); handleFiles(e.dataTransfer.files); }}
                                onClick={() => fileInputRef.current.click()}
                            >
                                <Icon name="file-stack" size={48} className="text-slate-500 mb-4" />
                                <p className="text-sm text-slate-400 mb-2">Sleep bestanden hierheen of klik om te bladeren</p>
                                <p className="text-xs text-slate-600">Ondersteunt PNG, JPG, SVG</p>
                                <input type="file" ref={fileInputRef} className="hidden" multiple accept="image/*,.svg" onChange={(e) => handleFiles(e.target.files)} />
                            </div>
                        )}

                        {mode === 'single' && singlePreview && (
                            <div className="flex gap-6">
                                <div className="w-1/3 aspect-square bg-slate-900 rounded-xl flex items-center justify-center border border-slate-700 p-2 relative">
                                    <img src={singlePreview} className="max-w-full max-h-full object-contain" />
                                    <button onClick={() => { setSinglePreview(null); setFilesToUpload([]); }} className="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full shadow-lg"><Icon name="x" size={12} /></button>
                                </div>
                                <div className="flex-1 space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Naam</label>
                                        <input type="text" value={singleFormData.name} onChange={(e) => setSingleFormData({...singleFormData, name: e.target.value})} className="w-full bg-dark border border-slate-600 rounded-lg p-3 text-white focus:border-primary outline-none text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Formaat (Resize)</label>
                                        <div className="flex flex-wrap gap-2">
                                            {['original', '128', '256', '512'].map(size => (
                                                <button key={size} onClick={() => setSingleFormData({...singleFormData, size})} className={`px-3 py-2 rounded-lg text-xs font-medium border ${singleFormData.size === size ? 'bg-primary text-white border-primary' : 'bg-dark text-slate-400 border-slate-700'}`}>
                                                    {size === 'original' ? 'Origineel' : `${size}px`}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {mode === 'bulk' && filesToUpload.length > 0 && (
                            <div className="space-y-2">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400">{filesToUpload.length} bestanden</span>
                                    <button onClick={() => setFilesToUpload([])} className="text-xs text-red-400 hover:underline">Wis alles</button>
                                </div>
                                {filesToUpload.map((f, i) => (
                                    <div key={i} className="flex items-center gap-3 bg-slate-800/50 p-2 rounded border border-slate-700/50">
                                        <div className="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-xs overflow-hidden">
                                            {f.isSvg ? 'SVG' : <img src={URL.createObjectURL(f.blob)} className="w-full h-full object-cover" />}
                                        </div>
                                        <span className="truncate flex-1 text-sm text-slate-300">{f.fileName}</span>
                                        <div className="flex gap-2 items-center">
                                            <span className="text-xs text-slate-500">{f.isSvg ? 'Vector' : `${f.width}x${f.height}`}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="p-4 border-t border-slate-700 bg-slate-800/50 flex justify-end gap-3">
                        <button onClick={onClose} disabled={isLoading} className="px-4 py-2 text-slate-400 hover:text-white text-sm">Annuleren</button>
                        <button 
                            onClick={handleUploadAction} 
                            disabled={isLoading || filesToUpload.length === 0} 
                            className={`px-6 py-2 rounded-lg text-white font-bold text-sm shadow-lg flex items-center gap-2 ${(isLoading || filesToUpload.length === 0) ? 'bg-slate-700 opacity-50' : 'bg-primary hover:bg-primary_hover'}`}
                        >
                            {isLoading && <Icon name="loader" className="animate-spin" size={16} />} 
                            {isLoading ? 'Bezig...' : (mode === 'single' ? 'Opslaan' : `Importeer ${filesToUpload.length} items`)}
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // 6. Create Collection Card
    const CreateCollectionCard = ({ onClick }) => (
        <div 
            onClick={onClick}
            className="bg-dark_paper/30 border-2 border-dashed border-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center cursor-pointer group hover:border-primary hover:bg-primary/5 transition-all h-full min-h-[200px]"
        >
            <div className="w-12 h-12 rounded-full bg-slate-800 group-hover:bg-primary group-hover:text-white flex items-center justify-center text-slate-400 mb-3 transition-colors shadow-inner">
                <Icon name="plus" size={24} />
            </div>
            <h3 className="font-bold text-slate-300 group-hover:text-primary text-sm">Nieuwe Collectie</h3>
        </div>
    );

    // --- APP CONTAINER ---
    const App = () => {
        const toast = useToast();
        const [data, setData] = useState({ folders: [], collections: [], icons: [] });
        
        // Navigation State
        const [activeFolderId, setActiveFolderId] = useState(null);
        const [activeCollectionId, setActiveCollectionId] = useState(null);
        const [showGenerator, setShowGenerator] = useState(false); // Nieuwe state
        
        // Filter & View State
        const [searchQuery, setSearchQuery] = useState('');
        const [activeTag, setActiveTag] = useState(null);
        const [viewMode, setViewMode] = useState('grid');
        const [sortBy, setSortBy] = useState('date');

        // Modal State
        const [isUploadOpen, setIsUploadOpen] = useState(false);
        const [uploadInitialFiles, setUploadInitialFiles] = useState(null);
        const [targetCollection, setTargetCollection] = useState(null);

        const refreshData = async () => {
            try {
                const res = await fetch(`${API_URL}/data`);
                if(!res.ok) throw new Error("API Error");
                const json = await res.json();
                setData(json);
            } catch (e) { console.error("DB Fetch failed", e); }
        };

        useEffect(() => { refreshData(); }, []);

        const activeFolder = data.folders.find(f => f.id === activeFolderId);
        const currentViewCollection = data.collections.find(c => c.id === activeCollectionId);
        const effectiveUploadCollection = targetCollection || currentViewCollection;

        const resetNavigation = () => { setActiveFolderId(null); setActiveCollectionId(null); setActiveTag(null); setSearchQuery(''); setShowGenerator(false); };
        const selectFolder = (fid) => { setActiveFolderId(fid); setActiveCollectionId(null); setActiveTag(null); setSearchQuery(''); setShowGenerator(false); };
        const selectTag = (tag) => { setActiveTag(tag); setActiveFolderId(null); setActiveCollectionId(null); setSearchQuery(''); setShowGenerator(false); };
        const openGenerator = () => { resetNavigation(); setShowGenerator(true); };

        const handleAddFolder = async (name) => {
            await fetch(`${API_URL}/folders`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
            refreshData();
            toast(`Map '${name}' aangemaakt`);
        };

        const handleAddCollection = async () => {
            if (!activeFolderId) return;
            const name = prompt("Naam van nieuwe collectie:");
            if (name) {
                await fetch(`${API_URL}/collections`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ folderId: activeFolderId, name }) });
                refreshData();
                toast(`Collectie '${name}' aangemaakt`);
            }
        };

        const handleDeleteIcon = async (id) => {
            if(confirm('Weet je zeker dat je dit icoon wilt verwijderen?')) {
                const res = await fetch(`${API_URL}/icons/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    refreshData();
                    toast('Icoon verwijderd');
                }
            }
        };

        // COPY FIX: Fallback voor onveilige contexten
        const handleCopyCode = async (url) => {
            const fullUrl = window.location.origin + url;
            const code = `<img src="${fullUrl}" alt="icon" />`;
            
            try {
                await navigator.clipboard.writeText(code);
                toast('HTML code gekopieerd');
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = code;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    toast('HTML code gekopieerd (fallback)');
                } catch (err2) {
                    toast('Kopiëren mislukt', 'error');
                }
                document.body.removeChild(textArea);
            }
        };

        const handleUpload = async (filesData, collection, folder) => {
            let errorCount = 0;
            for (const fileData of filesData) {
                const formData = new FormData();
                formData.append('iconFile', fileData.blob, fileData.fileName);
                formData.append('collectionId', collection.id);
                formData.append('collectionName', collection.name);
                formData.append('folderId', folder.id);
                formData.append('folderName', folder.name);
                formData.append('iconName', fileData.finalName);
                
                formData.append('width', fileData.width);
                formData.append('height', fileData.height);
                
                formData.append('iconTags', fileData.tags.join(','));

                const res = await fetch(`${API_URL}/upload-icon`, { method: 'POST', body: formData });
                if (res.status === 409) {
                    toast(`Fout: '${fileData.finalName}' bestaat al!`, 'error');
                    errorCount++;
                } else if (!res.ok) {
                    toast(`Fout bij uploaden ${fileData.finalName}`, 'error');
                    errorCount++;
                }
            }
            if (errorCount < filesData.length) {
                refreshData();
                toast('Upload voltooid');
            }
        };

        const handleCollectionDrop = (files, collection) => {
            setUploadInitialFiles(files);
            setTargetCollection(collection);
            setIsUploadOpen(true);
        };

        // Filter Logic
        const filteredIcons = useMemo(() => {
            let icons = data.icons;

            // 1. Scope
            if (activeCollectionId) {
                icons = icons.filter(i => i.collectionId === activeCollectionId);
            } else if (activeFolderId) {
                const colIds = data.collections.filter(c => c.folderId === activeFolderId).map(c => c.id);
                icons = icons.filter(i => colIds.includes(i.collectionId));
            }

            // 2. Search / Tag
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                icons = icons.filter(i => i.name.toLowerCase().includes(q));
            } else if (activeTag) {
                icons = icons.filter(i => i.tags && i.tags.includes(activeTag));
            }

            // 3. Sort
            return icons.sort((a, b) => {
                if (sortBy === 'name') return a.name.localeCompare(b.name);
                if (sortBy === 'size') return b.size - a.size;
                return new Date(b.dateAdded || 0) - new Date(a.dateAdded || 0);
            });
        }, [data.icons, activeCollectionId, activeFolderId, searchQuery, activeTag, sortBy]);

        const displayedCollections = useMemo(() => {
            if (activeFolderId) return data.collections.filter(c => c.folderId === activeFolderId);
            return data.collections; 
        }, [data.collections, activeFolderId]);


        return (
            <div className="flex h-screen bg-dark text-slate-200 font-sans selection:bg-primary selection:text-white">
                <Sidebar 
                    folders={data.folders} 
                    activeFolderId={activeFolderId} 
                    onSelectFolder={selectFolder}
                    onSelectAll={resetNavigation}
                    onAddFolder={handleAddFolder}
                    allIcons={data.icons}
                    activeTag={activeTag}
                    onSelectTag={selectTag}
                    onOpenGenerator={openGenerator}
                />

                <main className="flex-1 md:ml-64 flex flex-col h-full overflow-hidden relative">
                    {/* Header Bar */}
                    <header className="sticky top-0 z-20 bg-dark/80 backdrop-blur-md border-b border-slate-700/50 p-4 md:p-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                            
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                                    {showGenerator ? "Generator" : (
                                        <>
                                            {activeFolder && <span onClick={() => setActiveCollectionId(null)} className="cursor-pointer hover:text-primary transition-colors">{activeFolder.name}</span>}
                                            {activeFolder && activeCollectionId && <span className="text-slate-500">/</span>}
                                            {currentViewCollection ? currentViewCollection.name : (!activeFolder && "Bibliotheek")}
                                        </>
                                    )}
                                </h2>
                                {!showGenerator && (
                                    <p className="text-slate-400 text-sm hidden md:block">
                                        {searchQuery ? `Zoekresultaten voor "${searchQuery}"` : 
                                         activeTag ? `Filter: ${activeTag}` :
                                         currentViewCollection ? currentViewCollection.description : 
                                         "Beheer al je digitale assets op één plek"}
                                    </p>
                                )}
                            </div>

                            {!showGenerator && (
                                <div className="flex items-center gap-3 w-full md:w-auto">
                                    {/* Search */}
                                    <div className="relative flex-1 md:w-64 group">
                                        <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors" size={18} />
                                        <input 
                                            type="text" 
                                            placeholder="Zoeken..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full bg-dark_paper border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder-slate-500"
                                        />
                                        {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white"><Icon name="x" size={14} /></button>}
                                    </div>

                                    {/* Sort Dropdown */}
                                    <div className="relative hidden md:block">
                                        <select 
                                            value={sortBy} 
                                            onChange={(e) => setSortBy(e.target.value)}
                                            className="appearance-none bg-dark_paper border border-slate-700 rounded-xl py-2.5 pl-4 pr-8 text-sm text-slate-300 focus:border-primary outline-none cursor-pointer hover:border-slate-500 transition-colors"
                                        >
                                            <option value="date">Nieuwste</option>
                                            <option value="name">Naam (A-Z)</option>
                                            <option value="size">Grootte</option>
                                        </select>
                                        <Icon name="chevron-down" size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" />
                                    </div>

                                    {/* View Toggle */}
                                    <div className="flex bg-dark_paper rounded-xl p-1 border border-slate-700">
                                        <button onClick={() => setViewMode('grid')} className={`p-2 rounded-lg transition-all ${viewMode === 'grid' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}><Icon name="grid" size={18}/></button>
                                        <button onClick={() => setViewMode('list')} className={`p-2 rounded-lg transition-all ${viewMode === 'list' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}><Icon name="list" size={18}/></button>
                                    </div>
                                    
                                    {/* Upload Button */}
                                    {currentViewCollection && !searchQuery && !activeTag && (
                                        <button 
                                            onClick={() => { setTargetCollection(null); setIsUploadOpen(true); }}
                                            className="bg-primary hover:bg-primary_hover text-white p-2.5 md:px-4 md:py-2.5 rounded-xl shadow-lg transition-all flex items-center gap-2 font-medium whitespace-nowrap"
                                        >
                                            <Icon name="upload-cloud" size={20} />
                                            <span className="hidden md:inline">Uploaden</span>
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </header>

                    {/* CANVAS CONTENT */}
                    <div className="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-dark to-dark">
                        <div className="max-w-7xl mx-auto h-full">
                            
                            {showGenerator ? (
                                <GeneratorView />
                            ) : (
                                <>
                                    {/* Scenario 1: Zoeken of Tag Filter */}
                                    {(searchQuery || activeTag) && (
                                        <div>
                                            <div className="flex justify-between items-end mb-4 border-b border-slate-800 pb-2">
                                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider">Resultaten</h3>
                                                <span className="text-xs text-slate-500">{filteredIcons.length} gevonden</span>
                                            </div>
                                            {filteredIcons.length === 0 ? (
                                                <div className="text-center py-20 text-slate-500">
                                                    <Icon name="search-x" size={48} className="mx-auto mb-4 opacity-50" />
                                                    <p>Geen iconen gevonden.</p>
                                                </div>
                                            ) : (
                                                <div className={viewMode === 'grid' ? "layout-grid" : "layout-list"}>
                                                    {filteredIcons.map(icon => <IconCard key={icon.id} icon={icon} onDelete={handleDeleteIcon} viewMode={viewMode} onCopy={handleCopyCode} />)}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Scenario 2: Binnen een Collectie */}
                                    {!searchQuery && !activeTag && currentViewCollection && (
                                        <div className="h-full flex flex-col">
                                            <div className="flex items-center gap-2 mb-4">
                                                <button onClick={() => setActiveCollectionId(null)} className="flex items-center gap-1 text-sm text-slate-400 hover:text-white transition-colors">
                                                    <Icon name="arrow-left" size={16} /> Terug
                                                </button>
                                            </div>
                                            
                                            {filteredIcons.length === 0 ? (
                                                <div className="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-700/50 rounded-3xl bg-slate-900/30 p-10 text-center">
                                                    <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4 text-slate-600">
                                                        <Icon name="image" size={32} />
                                                    </div>
                                                    <h3 className="text-lg font-bold text-slate-300 mb-2">Nog geen iconen</h3>
                                                    <p className="text-slate-500 mb-6 max-w-sm">Sleep bestanden hierheen of gebruik de upload knop om te beginnen.</p>
                                                    <button onClick={() => { setTargetCollection(null); setIsUploadOpen(true); }} className="text-primary hover:text-white font-medium hover:underline">Start Upload</button>
                                                </div>
                                            ) : (
                                                <div className={viewMode === 'grid' ? "layout-grid" : "layout-list"}>
                                                    {filteredIcons.map(icon => <IconCard key={icon.id} icon={icon} onDelete={handleDeleteIcon} viewMode={viewMode} onCopy={handleCopyCode} />)}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Scenario 3: Collectie Overzicht (Dashboard) */}
                                    {!searchQuery && !activeTag && !currentViewCollection && (
                                        <div>
                                            {!activeFolderId && displayedCollections.length === 0 ? (
                                                <div className="text-center py-32">
                                                    <div className="w-20 h-20 bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-2xl border border-slate-700">
                                                        <Icon name="layers" size={40} className="text-slate-500" />
                                                    </div>
                                                    <h2 className="text-2xl font-bold text-white mb-2">Welkom in IconVault</h2>
                                                    <p className="text-slate-400 max-w-md mx-auto mb-8">Selecteer een map aan de linkerkant of maak er eentje aan om te beginnen met organiseren.</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                                    {activeFolderId && <CreateCollectionCard onClick={handleAddCollection} />}
                                                    
                                                    {displayedCollections.map(col => {
                                                        const colIcons = data.icons.filter(i => i.collectionId === col.id);
                                                        return (
                                                            <CollectionCard 
                                                                key={col.id} 
                                                                collection={col} 
                                                                icons={colIcons} 
                                                                onClick={() => setActiveCollectionId(col.id)}
                                                                onDropFile={handleCollectionDrop}
                                                            />
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </main>

                <UploadModal 
                    isOpen={isUploadOpen} 
                    onClose={() => { setIsUploadOpen(false); setUploadInitialFiles(null); }} 
                    onUpload={handleUpload}
                    activeCollection={effectiveUploadCollection}
                    activeFolder={activeFolder || data.folders.find(f => f.id === effectiveUploadCollection?.folderId)}
                    initialFiles={uploadInitialFiles}
                />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
        <ToastProvider>
            <App />
        </ToastProvider>
    );
</script>

</body>
</html>
