<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconVault - Collectie Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel voor JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f172a',       // Slate 900
                        dark_paper: '#1e293b', // Slate 800
                        primary: '#6366f1',    // Indigo 500
                        primary_hover: '#4f46e5',
                        accent: '#8b5cf6'      // Violet 500
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        
        .hover-lift {
            transition: all 0.2s ease-in-out;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border-color: #6366f1;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const BACKEND_API_URL = '/api/upload-icon'; 

    // --- Utility: Image Resizer (HERSTELD) ---
    const processImage = (file, size) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const fileName = file.name.split('.')[0].replace(/[-_]/g, '_') + '.png';

                    if (size === 'original') {
                        resolve({ blob: file, fileName });
                        return;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = parseInt(size);
                    canvas.height = parseInt(size);
                    const ctx = canvas.getContext('2d');
                    
                    const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                    const w = img.width * scale;
                    const h = img.height * scale;
                    const x = (canvas.width - w) / 2;
                    const y = (canvas.height - h) / 2;

                    ctx.drawImage(img, x, y, w, h);

                    canvas.toBlob((blob) => {
                        resolve({ blob, fileName });
                    }, 'image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    };

    // --- Utility: Backend Communicatie (MET FIX) ---
    const uploadIconToServer = async (fileObject, metadata) => {
        console.log('Start upload:', metadata.iconName);
        
        const formData = new FormData();
        // BELANGRIJK: Tekstvelden EERST voor Multer
        formData.append('collectionId', metadata.collectionId);
        formData.append('collectionName', metadata.collectionName);
        formData.append('folderId', metadata.folderId);
        formData.append('folderName', metadata.folderName);
        formData.append('iconName', metadata.iconName);
        formData.append('iconTags', metadata.iconTags.join(','));
        // Bestand als LAATSTE
        formData.append('iconFile', fileObject.blob, fileObject.fileName);

        try {
            const response = await fetch(BACKEND_API_URL, {
                method: 'POST',
                body: formData,
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.message || 'Upload mislukt op de server.');
            }

            const data = await response.json();
            return { url: data.iconUrl };

        } catch (error) {
            console.error('Fout bij upload:', error);
            throw error;
        }
    };

    // --- Icons ---
    const Icon = ({ name, size = 24, className, ...props }) => {
        const ref = useRef(null);
        useEffect(() => {
            if (window.lucide) {
                window.lucide.createIcons({
                    root: ref.current,
                    nameAttr: 'data-lucide',
                    attrs: { width: size, height: size, class: className }
                });
            }
        }, [name, size, className]);
        return <span ref={ref} {...props}><i data-lucide={name}></i></span>;
    };

    const Search = (p) => <Icon name="search" {...p} />;
    const Plus = (p) => <Icon name="plus" {...p} />;
    const Download = (p) => <Icon name="download" {...p} />;
    const ArrowLeft = (p) => <Icon name="arrow-left" {...p} />;
    const ImageIcon = (p) => <Icon name="image" {...p} />;
    const Trash2 = (p) => <Icon name="trash-2" {...p} />;
    const Folder = (p) => <Icon name="folder" {...p} />;
    const LayoutGrid = (p) => <Icon name="layout-grid" {...p} />;
    const UploadCloud = (p) => <Icon name="upload-cloud" {...p} />;
    const X = (p) => <Icon name="x" {...p} />;
    const Layers = (p) => <Icon name="layers" {...p} />;
    const Briefcase = (p) => <Icon name="briefcase" {...p} />;
    const Megaphone = (p) => <Icon name="megaphone" {...p} />;
    const Monitor = (p) => <Icon name="monitor" {...p} />;
    const Archive = (p) => <Icon name="archive" {...p} />;
    const FolderInput = (p) => <Icon name="folder-input" {...p} />;
    const FileStack = (p) => <Icon name="file-stack" {...p} />;
    const Check = (p) => <Icon name="check" {...p} />;
    const Loader = (p) => <Icon name="loader" {...p} />;

    // --- Mock Data ---
    const INITIAL_FOLDERS = [
        { id: 'f1', name: "Design System", icon: "monitor" },
        { id: 'f2', name: "Marketing", icon: "megaphone" },
        { id: 'f3', name: "Administratie", icon: "briefcase" },
    ];

    const INITIAL_COLLECTIONS = [
        { id: 'c1', folderId: 'f1', name: "Interface Assets", description: "UI elementen" },
        { id: 'c2', folderId: 'f2', name: "Social Media", description: "Logos en shares" },
    ];

    const INITIAL_ICONS = [
        { id: 1, collectionId: 'c1', name: "Dashboard Home", url: "https://cdn-icons-png.flaticon.com/512/1828/1828765.png", tags: ["ui", "home"] },
        { id: 2, collectionId: 'c2', name: "User Profile", url: "https://cdn-icons-png.flaticon.com/512/1077/1077114.png", tags: ["user", "account"] },
    ];

    // --- Components ---

    const Sidebar = ({ folders, activeFolderId, onSelectFolder, onSelectAll, onAddFolder }) => {
        const handleCreateFolder = () => {
            const name = prompt("Naam van nieuwe map:");
            if (name) onAddFolder(name);
        };

        return (
            <aside className="hidden md:flex flex-col w-64 h-screen bg-dark_paper border-r border-slate-700 fixed left-0 top-0 overflow-y-auto">
                <div className="p-6 flex items-center gap-3 border-b border-slate-700/50">
                    <div className="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-xl flex items-center justify-center text-white shadow-lg">
                        <Layers size={20} />
                    </div>
                    <div>
                        <h1 className="font-bold text-xl text-white tracking-tight">IconVault</h1>
                        <p className="text-xs text-slate-400">Collectie Manager</p>
                    </div>
                </div>

                <div className="p-4">
                    <div className="flex justify-between items-center mb-3 px-2">
                        <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Bibliotheek</div>
                        <button onClick={handleCreateFolder} className="text-primary hover:text-white transition-colors" title="Nieuwe map">
                            <Plus size={16} />
                        </button>
                    </div>
                    <nav className="space-y-1">
                        <button 
                            onClick={onSelectAll}
                            className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                                activeFolderId === null 
                                ? 'bg-primary/10 text-primary border border-primary/20' 
                                : 'text-slate-400 hover:bg-slate-800 hover:text-white border border-transparent'
                            }`}
                        >
                            <LayoutGrid size={18} />
                            Alle Collecties
                        </button>
                        <div className="pt-2 pb-2"></div>
                        {folders.map(folder => (
                            <button 
                                key={folder.id}
                                onClick={() => onSelectFolder(folder.id)}
                                className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${
                                    activeFolderId === folder.id
                                    ? 'bg-slate-800 text-white border border-slate-700' 
                                    : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 border border-transparent'
                                }`}
                            >
                                <Icon name={folder.icon || 'folder'} size={18} />
                                {folder.name}
                            </button>
                        ))}
                    </nav>
                </div>
            </aside>
        );
    };

    // --- UPLOAD MODAL (HERSTELD: Inclusief Tabs, Resize & Bulk) ---
    const UploadModal = ({ isOpen, onClose, onUpload, activeCollection, activeFolder }) => {
        const [mode, setMode] = useState('single'); // 'single' or 'bulk'
        const [dragActive, setDragActive] = useState(false);
        const [isLoading, setIsLoading] = useState(false);
        
        // Single Upload State
        const [preview, setPreview] = useState(null);
        const [fileObj, setFileObj] = useState(null); 
        const [formData, setFormData] = useState({ name: '', tags: '', size: 'original' });
        
        // Bulk Upload State
        const [bulkFiles, setBulkFiles] = useState([]);
        
        const fileInputRef = useRef(null);
        const folderInputRef = useRef(null);

        // Reset state on open
        useEffect(() => {
            if(isOpen) {
                setMode('single');
                setPreview(null);
                setFileObj(null);
                setBulkFiles([]);
                setFormData({ name: '', tags: '', size: 'original' });
                setIsLoading(false);
            }
        }, [isOpen]);

        if (!isOpen) return null;

        const activeCollectionName = activeCollection?.name || 'Onbekend';

        // --- Single Upload Logic ---
        const handleSingleFile = (file) => {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    setPreview(e.target.result);
                    setFileObj(file);
                };
                reader.readAsDataURL(file);
                const name = file.name.split('.')[0].replace(/[-_]/g, ' ');
                setFormData(prev => ({ ...prev, name }));
            }
        };

        const handleSingleSubmit = async () => {
            if (!fileObj || !formData.name || !activeCollection || !activeFolder) return;
            setIsLoading(true);

            try {
                // Resize logica (HERSTELD)
                const fileForUpload = await processImage(fileObj, formData.size);
                const tags = formData.tags.split(',').map(t => t.trim()).filter(t => t);

                const metadata = {
                    collectionId: activeCollection.id,
                    collectionName: activeCollection.name,
                    folderId: activeFolder.id,
                    folderName: activeFolder.name,
                    iconName: formData.name,
                    iconTags: tags,
                    size: formData.size
                };

                const result = await uploadIconToServer(fileForUpload, metadata);

                onUpload([{ name: metadata.iconName, url: result.url, tags: tags }]);
                onClose();

            } catch (error) {
                console.error(error);
                alert('Fout bij upload: ' + error.message); 
            } finally {
                setIsLoading(false);
            }
        };

        // --- Bulk Upload Logic (HERSTELD) ---
        const handleBulkFiles = (files) => {
            const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            setBulkFiles(prev => [...prev, ...validFiles]);
        };

        const handleBulkSubmit = async () => {
            if (bulkFiles.length === 0 || !activeCollection || !activeFolder) return;
            setIsLoading(true);

            try {
                const results = await Promise.all(bulkFiles.map(async (file) => {
                    // Bulk is altijd origineel formaat
                    const fileForUpload = await processImage(file, 'original');
                    const iconName = file.name.split('.')[0].replace(/[-_]/g, ' ');
                    const tags = ['bulk-import'];

                    const metadata = {
                        collectionId: activeCollection.id,
                        collectionName: activeCollection.name,
                        folderId: activeFolder.id,
                        folderName: activeFolder.name,
                        iconName: iconName,
                        iconTags: tags,
                        size: 'original'
                    };

                    const result = await uploadIconToServer(fileForUpload, metadata);
                    return { name: iconName, url: result.url, tags: tags };
                }));

                onUpload(results);
                onClose();

            } catch (error) {
                console.error(error);
                alert('Fout bij bulk upload: zie console voor details.');
            } finally {
                setIsLoading(false);
            }
        };

        // --- Drag & Drop ---
        const handleDrop = (e) => {
            e.preventDefault(); e.stopPropagation(); setDragActive(false);
            if (mode === 'single') {
                if (e.dataTransfer.files[0]) handleSingleFile(e.dataTransfer.files[0]);
            } else {
                handleBulkFiles(e.dataTransfer.files);
            }
        };

        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200">
                <div className="bg-dark_paper w-full max-w-xl rounded-2xl border border-slate-600 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                    
                    {isLoading && (
                        <div className="absolute inset-0 z-50 bg-slate-900/90 flex items-center justify-center flex-col text-white backdrop-blur-sm">
                            <Loader size={48} className="animate-spin text-primary" />
                            <p className="mt-3 text-sm font-medium">Bezig met uploaden...</p>
                        </div>
                    )}

                    <div className="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                        <div>
                            <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                <UploadCloud className="text-primary" size={24} />
                                Icoon Toevoegen
                            </h3>
                            <p className="text-xs text-slate-400 mt-1">Aan: <span className="text-primary font-bold">{activeCollectionName}</span> (Map: {activeFolder?.name})</p>
                        </div>
                        <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={24} /></button>
                    </div>

                    {/* Tabs (HERSTELD) */}
                    <div className="flex border-b border-slate-700">
                        <button 
                            onClick={() => setMode('single')} 
                            className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${mode === 'single' ? 'border-primary text-white bg-primary/5' : 'border-transparent text-slate-400 hover:text-white'}`}
                        >
                            Enkel Bestand
                        </button>
                        <button 
                            onClick={() => setMode('bulk')} 
                            className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${mode === 'bulk' ? 'border-primary text-white bg-primary/5' : 'border-transparent text-slate-400 hover:text-white'}`}
                        >
                            Bulk Import (Folder)
                        </button>
                    </div>

                    <div className="p-6 overflow-y-auto custom-scrollbar">
                        
                        {/* SINGLE MODE */}
                        {mode === 'single' && (
                            <div className="space-y-4">
                                <div 
                                    className={`relative h-48 border-2 border-dashed rounded-xl flex flex-col items-center justify-center transition-colors cursor-pointer
                                        ${dragActive ? 'border-primary bg-primary/10' : 'border-slate-600 hover:border-slate-500 bg-dark'}
                                        ${preview ? 'border-none p-0 overflow-hidden bg-transparent' : ''}`}
                                    onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }}
                                    onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }}
                                    onDragOver={(e) => { e.preventDefault(); }}
                                    onDrop={handleDrop}
                                    onClick={() => !preview && fileInputRef.current.click()}
                                >
                                    {preview ? (
                                        <div className="relative w-full h-full bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAHElEQVQYlWNgYGD4z8DAwMgwyoAOSMQAoQowAABWJgQD63K4OQAAAABJRU5ErkJggg==')]">
                                            <img src={preview} alt="Preview" className="w-full h-full object-contain p-4" />
                                            <button onClick={(e) => { e.stopPropagation(); setPreview(null); setFileObj(null); }} className="absolute top-2 right-2 p-1 bg-red-500 rounded-full text-white shadow-lg hover:bg-red-600"><X size={16} /></button>
                                        </div>
                                    ) : (
                                        <>
                                            <ImageIcon size={48} className="text-slate-500 mb-2" />
                                            <p className="text-sm text-slate-400">Klik of sleep afbeelding</p>
                                        </>
                                    )}
                                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={(e) => handleSingleFile(e.target.files[0])} />
                                </div>

                                <div className="space-y-4">
                                    {/* Resize Opties (HERSTELD) */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Formaat & Conversie</label>
                                        <div className="grid grid-cols-4 gap-2">
                                            {['original', '192', '512', '1024'].map(size => (
                                                <button
                                                    key={size}
                                                    onClick={() => setFormData({...formData, size})}
                                                    className={`px-2 py-2 rounded-lg text-xs font-medium border ${
                                                        formData.size === size 
                                                        ? 'bg-primary text-white border-primary' 
                                                        : 'bg-dark text-slate-400 border-slate-700 hover:border-slate-500'
                                                    }`}
                                                >
                                                    {size === 'original' ? 'Origineel' : `${size}x${size}`}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Naam</label>
                                            <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full bg-dark border border-slate-600 rounded-lg p-3 text-white focus:border-primary outline-none text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tags</label>
                                            <input type="text" value={formData.tags} onChange={(e) => setFormData({...formData, tags: e.target.value})} placeholder="optioneel" className="w-full bg-dark border border-slate-600 rounded-lg p-3 text-white focus:border-primary outline-none text-sm" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* BULK MODE (HERSTELD) */}
                        {mode === 'bulk' && (
                            <div className="space-y-4">
                                <div 
                                    className={`relative border-2 border-dashed rounded-xl flex flex-col items-center justify-center p-8 transition-colors
                                        ${dragActive ? 'border-primary bg-primary/10' : 'border-slate-600 bg-dark'}`}
                                    onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }}
                                    onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }}
                                    onDragOver={(e) => { e.preventDefault(); }}
                                    onDrop={handleDrop}
                                >
                                    <FileStack size={48} className="text-slate-500 mb-4" />
                                    <div className="flex gap-3">
                                        <button 
                                            onClick={() => fileInputRef.current.click()} 
                                            className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium"
                                        >
                                            Selecteer Bestanden
                                        </button>
                                        <button 
                                            onClick={() => folderInputRef.current.click()} 
                                            className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium flex items-center gap-2"
                                        >
                                            <FolderInput size={16} /> Selecteer Map
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-3">Of sleep bestanden hierheen</p>

                                    {/* Hidden Inputs */}
                                    <input 
                                        type="file" 
                                        ref={fileInputRef} 
                                        className="hidden" 
                                        multiple 
                                        accept="image/*" 
                                        onChange={(e) => handleBulkFiles(e.target.files)} 
                                    />
                                    <input 
                                        type="file" 
                                        ref={folderInputRef} 
                                        className="hidden" 
                                        webkitdirectory="" 
                                        directory="" 
                                        multiple 
                                        onChange={(e) => handleBulkFiles(e.target.files)} 
                                    />
                                </div>

                                {/* File List Preview */}
                                {bulkFiles.length > 0 && (
                                    <div className="bg-dark rounded-xl border border-slate-700 p-3 max-h-48 overflow-y-auto">
                                        <div className="flex justify-between items-center mb-2 px-1">
                                            <span className="text-xs font-bold text-slate-400">{bulkFiles.length} bestanden klaar voor import</span>
                                            <button onClick={() => setBulkFiles([])} className="text-xs text-red-400 hover:underline">Wis alles</button>
                                        </div>
                                        <div className="space-y-1">
                                            {bulkFiles.map((f, i) => (
                                                <div key={i} className="flex items-center gap-2 text-sm text-slate-300 bg-slate-800/50 p-2 rounded">
                                                    <Check size={14} className="text-green-500" />
                                                    <span className="truncate flex-1">{f.name}</span>
                                                    <span className="text-xs text-slate-500">{Math.round(f.size/1024)}KB</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>

                    <div className="p-4 border-t border-slate-700 bg-slate-800/50 flex justify-end gap-3">
                        <button onClick={onClose} disabled={isLoading} className="px-4 py-2 text-slate-400 hover:text-white text-sm">Annuleren</button>
                        {mode === 'single' ? (
                            <button 
                                onClick={handleSingleSubmit} 
                                disabled={isLoading || !preview || !formData.name} 
                                className={`px-6 py-2 rounded-lg text-white font-bold text-sm shadow-lg flex items-center gap-2 ${(isLoading || !preview || !formData.name) ? 'bg-slate-700 opacity-50' : 'bg-primary'}`}
                            >
                                <Plus size={16} /> Opslaan
                            </button>
                        ) : (
                            <button 
                                onClick={handleBulkSubmit} 
                                disabled={isLoading || bulkFiles.length === 0} 
                                className={`px-6 py-2 rounded-lg text-white font-bold text-sm shadow-lg flex items-center gap-2 ${(isLoading || bulkFiles.length === 0) ? 'bg-slate-700 opacity-50' : 'bg-primary'}`}
                            >
                                <UploadCloud size={16} /> Importeer Alles
                            </button>
                        )}
                    </div>
                </div>
            </div>
        );
    };

    const CollectionCard = ({ collection, icons, onClick }) => {
        const previewIcons = icons.slice(0, 4);

        return (
            <div 
                onClick={onClick}
                className="hover-lift bg-dark_paper border border-slate-700 rounded-2xl p-4 flex flex-col cursor-pointer group h-auto"
            >
                <div className="w-full aspect-square mb-3 bg-dark rounded-xl overflow-hidden p-1 relative">
                    {icons.length > 0 ? (
                        <div className="folder-grid w-full h-full">
                            {previewIcons.map(icon => (
                                <div key={icon.id} className="bg-slate-800/50 rounded flex items-center justify-center p-2 overflow-hidden">
                                    <img src={icon.url} className="w-full h-full object-contain opacity-90" />
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="w-full h-full flex items-center justify-center text-slate-600">
                            <ImageIcon size={32} />
                        </div>
                    )}
                </div>

                <div className="flex items-center justify-between mt-auto">
                    <div>
                        <h3 className="font-bold text-slate-200 text-sm truncate w-24 md:w-32">{collection.name}</h3>
                        <p className="text-[10px] text-slate-500">{icons.length} iconen</p>
                    </div>
                    <Folder className="text-slate-600 group-hover:text-primary transition-colors" size={20} />
                </div>
            </div>
        );
    };

    const CreateCollectionCard = ({ onClick }) => (
        <div 
            onClick={onClick}
            className="bg-dark_paper/30 border-2 border-dashed border-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center cursor-pointer group hover:border-primary hover:bg-primary/5 transition-all aspect-square sm:aspect-auto sm:h-full"
        >
            <div className="w-12 h-12 rounded-full bg-slate-800 group-hover:bg-primary group-hover:text-white flex items-center justify-center text-slate-400 mb-3 transition-colors">
                <Plus size={24} />
            </div>
            <h3 className="font-bold text-slate-300 group-hover:text-primary text-sm">Nieuwe Collectie</h3>
        </div>
    );

    const IconCard = ({ icon, onDelete }) => {
        const handleDownload = (e) => {
            e.stopPropagation();
            const link = document.createElement('a');
            link.href = icon.url;
            link.download = `${icon.name.replace(/\s+/g, '_')}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        return (
            <div className="group relative aspect-square bg-dark_paper border border-slate-700 rounded-2xl overflow-hidden hover:border-primary transition-colors cursor-pointer">
                <div className="absolute inset-0 opacity-10 bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAHElEQVQYlWNgYGD4z8DAwMgwyoAOSMQAoQowAABWJgQD63K4OQAAAABJRU5ErkJggg==')]"></div>
                <div className="absolute inset-0 flex items-center justify-center p-4">
                    <img 
                        src={icon.url} 
                        alt={icon.name} 
                        className="w-full h-full object-contain drop-shadow-sm transition-transform duration-300 group-hover:scale-105" 
                    />
                </div>
                <div className="absolute inset-0 bg-slate-900/90 opacity-0 group-hover:opacity-100 transition-all duration-200 flex flex-col items-center justify-center gap-3 p-4 backdrop-blur-sm">
                    <span className="text-white font-bold text-sm text-center truncate w-full px-2">{icon.name}</span>
                    <div className="flex gap-2">
                         <button onClick={handleDownload} className="p-2.5 bg-primary text-white rounded-full shadow-lg hover:bg-primary_hover"><Download size={20} /></button>
                        <button onClick={(e) => { e.stopPropagation(); onDelete(icon.id); }} className="p-2.5 bg-slate-700 text-red-400 hover:bg-red-500 hover:text-white rounded-full shadow-lg"><Trash2 size={20} /></button>
                    </div>
                </div>
            </div>
        );
    };

    const App = () => {
        const [folders, setFolders] = useState(INITIAL_FOLDERS);
        const [collections, setCollections] = useState(INITIAL_COLLECTIONS);
        const [icons, setIcons] = useState(INITIAL_ICONS);
        
        const [activeFolderId, setActiveFolderId] = useState('f1');
        const [activeCollectionId, setActiveCollectionId] = useState(null);
        const [searchQuery, setSearchQuery] = useState('');
        const [isUploadOpen, setIsUploadOpen] = useState(false);

        const activeCollection = collections.find(c => c.id === activeCollectionId);
        const activeFolder = folders.find(f => f.id === activeFolderId);

        const resetToRoot = () => { setActiveFolderId(null); setActiveCollectionId(null); setSearchQuery(''); };
        const selectFolder = (folderId) => { setActiveFolderId(folderId); setActiveCollectionId(null); setSearchQuery(''); };

        const handleAddFolder = (name) => {
            const newFolder = { id: `f${Date.now()}`, name, icon: 'folder' };
            setFolders([...folders, newFolder]);
            setActiveFolderId(newFolder.id);
        };

        const handleAddCollection = () => {
            if (!activeFolderId) return;
            const name = prompt("Naam van nieuwe collectie:");
            if (name) {
                const newCollection = { 
                    id: `c${Date.now()}`, 
                    folderId: activeFolderId, 
                    name, 
                    description: "Nieuwe collectie" 
                };
                setCollections([...collections, newCollection]);
            }
        };

        const isSearching = searchQuery.length > 0;
        
        const filteredGlobalIcons = useMemo(() => {
            if (!isSearching) return [];
            const q = searchQuery.toLowerCase();
            return icons.filter(i => i.name.toLowerCase().includes(q) || i.tags.some(t => t.toLowerCase().includes(q)));
        }, [icons, searchQuery, isSearching]);

        const displayedCollections = useMemo(() => {
            if (activeFolderId) return collections.filter(c => c.folderId === activeFolderId);
            return collections; 
        }, [collections, activeFolderId]);

        const collectionIcons = useMemo(() => {
            if (!activeCollectionId) return [];
            return icons.filter(i => i.collectionId === activeCollectionId);
        }, [icons, activeCollectionId]);

        const handleUpload = (newIconsArray) => {
            if (!activeCollectionId) return;
            const newIconObjects = newIconsArray.map(iconData => ({
                id: Date.now() + Math.random(), 
                collectionId: activeCollectionId, 
                ...iconData
            }));
            setIcons(prev => [...newIconObjects, ...prev]);
        };

        const handleDeleteIcon = (id) => {
            if(confirm('Weet je zeker dat je dit icoon wilt verwijderen?')) setIcons(prev => prev.filter(i => i.id !== id));
        };

        return (
            <div className="flex h-screen bg-dark text-slate-200 font-sans selection:bg-primary selection:text-white">
                <Sidebar 
                    folders={folders} 
                    activeFolderId={activeFolderId} 
                    onSelectFolder={selectFolder}
                    onSelectAll={resetToRoot}
                    onAddFolder={handleAddFolder}
                />

                <main className="flex-1 md:ml-64 flex flex-col h-full overflow-hidden relative">
                    <header className="sticky top-0 z-20 bg-dark/80 backdrop-blur-md border-b border-slate-700/50 p-4 md:p-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-tight">
                                    {isSearching ? 'Zoekresultaten' : (
                                        activeCollection ? activeCollection.name : 
                                        (activeFolder ? activeFolder.name : 'Bibliotheek Overzicht')
                                    )}
                                </h2>
                                <p className="text-slate-400 text-sm hidden md:block">
                                    {isSearching ? `Gevonden: ${filteredGlobalIcons.length} iconen` : ''}
                                    {!isSearching && activeCollection && activeCollection.description}
                                </p>
                            </div>

                            <div className="flex items-center gap-3 w-full md:w-auto">
                                <div className="relative flex-1 md:w-80 group">
                                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors" size={18} />
                                    <input 
                                        type="text" 
                                        placeholder="Zoek icoon..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-dark_paper border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder-slate-500"
                                    />
                                    {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white"><X size={14} /></button>}
                                </div>
                                
                                {activeCollection && !isSearching && (
                                    <button 
                                        onClick={() => setIsUploadOpen(true)}
                                        className="bg-primary hover:bg-primary_hover text-white p-2.5 md:px-4 md:py-2.5 rounded-xl shadow-lg transition-all flex items-center gap-2 font-medium whitespace-nowrap"
                                    >
                                        <Plus size={20} />
                                        <span className="hidden md:inline">Nieuw Icoon</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth">
                        <div className="max-w-7xl mx-auto">
                            
                            {isSearching && (
                                <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-3">
                                    {filteredGlobalIcons.map(icon => <IconCard key={icon.id} icon={icon} onDelete={handleDeleteIcon} />)}
                                </div>
                            )}

                            {!isSearching && activeCollection && (
                                <div>
                                    <button onClick={() => setActiveCollectionId(null)} className="mb-4 flex items-center gap-2 text-sm text-slate-400 hover:text-white transition-colors">
                                        <ArrowLeft size={16} /> Terug naar {activeFolder ? activeFolder.name : 'overzicht'}
                                    </button>
                                    
                                    {collectionIcons.length === 0 ? (
                                        <div className="border-2 border-dashed border-slate-700 rounded-2xl p-10 text-center">
                                            <p className="text-slate-500 mb-4">Deze collectie is nog leeg.</p>
                                            <button onClick={() => setIsUploadOpen(true)} className="text-primary hover:underline">Upload je eerste icoon</button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-3">
                                            {collectionIcons.map(icon => <IconCard key={icon.id} icon={icon} onDelete={handleDeleteIcon} />)}
                                        </div>
                                    )}
                                </div>
                            )}

                            {!isSearching && !activeCollection && (
                                <div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                                        {/* Create New Collection Button (Only visible inside a folder) */}
                                        {activeFolderId && <CreateCollectionCard onClick={handleAddCollection} />}
                                        
                                        {displayedCollections.map(col => {
                                            const colIcons = icons.filter(i => i.collectionId === col.id);
                                            return <CollectionCard key={col.id} collection={col} icons={colIcons} onClick={() => setActiveCollectionId(col.id)} />;
                                        })}
                                    </div>
                                    {displayedCollections.length === 0 && !activeFolderId && (
                                        <p className="text-center text-slate-500 mt-10">Selecteer een map om collecties te zien.</p>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </main>

                <UploadModal 
                    isOpen={isUploadOpen} 
                    onClose={() => setIsUploadOpen(false)} 
                    onUpload={handleUpload}
                    activeCollection={activeCollection}
                    activeFolder={activeFolder}
                />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
